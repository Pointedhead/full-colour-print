<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .frame-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    iframe {
      position: absolute;
      top: -70px;
      left: 0;
      width: 100%;
      height: calc(100% + 70px);
      border: none;
    }
  </style>
</head>
<body>
  <div class="frame-wrapper">
    <iframe src="https://colourwoosh.wixsite.com/full-colour-print" allowfullscreen></iframe>
  </div>
</body>
</html>
